name: Backend CI - Build and Push to Docker Hub

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Vincula o job de forma segura ao ambiente criado no seu GitHub Settings
    environment: dockerhub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # Garante a compatibilidade ao rodar o front em Mac M1/M2 ou servidores ARM       
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/api-paython-docker:latest
            ${{ secrets.DOCKERHUB_USER }}/api-paython-docker:${{ github.sha }}
          # ATIVAÇÃO DO CACHE GHA: Busca e salva o cache nativo do GitHub Actions
          cache-from: type=gha
          cache-to: type=gha,mode=max
